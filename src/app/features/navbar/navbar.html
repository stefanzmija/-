
<section class="shadow-2xl shadow-gray-500 p-4 align-middle">
  <div class="grid grid-cols-5 mx-auto text-center text-xl font-semibold pt-2 cursor-pointer">
    <a routerLink="/home" class=" nav-link cursor-pointer">Почетна</a>
    <a routerLink="/my-tickets" class="nav-link cursor-pointer">Мој Тикети</a>
    <a routerLink="/home" class="cursor-pointer"><img src="Logo_FINKI_UKIM_MK.jpg" alt="ФИНКИ" class="h-12 mx-auto"></a>
    <a routerLink="/contact" class="nav-link cursor-pointer">Контакт</a>
    @if (auth.isLoggedIn()) {
      <a (click)="auth.logout()" class="nav-link">Одјава</a>
    } @else {
      <a routerLink="/login" class="nav-link">Најава</a>
    }
  </div>
</section>
