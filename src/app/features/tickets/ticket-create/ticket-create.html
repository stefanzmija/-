<section class="mx-auto mt-12 mb-20 max-w-2xl px-6">
  <h1 class="text-4xl font-semibold tracking-tight text-gray-900">Ново барање</h1>
  <p class="mt-2 font-light text-gray-600">
    Опиши го барањето што е подетално за да добиеш побрз одговор.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()"
        class="mt-10 space-y-6 rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">

    <div>
      <label class="block text-sm font-medium text-gray-700">Наслов</label>
      <input formControlName="title" type="text" placeholder="пр. Потврда за редовен студент"
             class="mt-1 w-full rounded-lg border border-gray-300  hover:border-blue-600 duration-300 px-4 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30" />
    </div>

    <div class="grid gap-6 sm:grid-cols-2">
      <div>
        <label class="block text-sm font-medium text-gray-700">Категорија</label>
        <select formControlName="category_id"
                class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 hover:border-blue-600 duration-300 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
          <option value="" disabled>Избери категорија…</option>
          @for (c of categories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Приоритет</label>
        <select formControlName="priority"
                class="mt-1 w-full rounded-lg border border-gray-300 hover:border-blue-600 duration-300 bg-white px-4 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30">
          <option value="low">Ниска</option>
          <option value="normal">Нормална</option>
          <option value="high">Висока</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Опис</label>
      <textarea formControlName="description" rows="6"
                placeholder="Опиши го барањето, наведи индекс, година, и сѐ што е важно…"
                class="mt-1 w-full resize-y rounded-lg border border-gray-300 hover:border-blue-600 duration-300 px-4 py-2.5 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <p class="mt-1 text-xs text-red-600">Описот мора да има најмалку 10 карактери.</p>
      }
    </div>

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-4 py-2 text-sm text-red-700">{{ error() }}</p>
    }

    <div class="flex justify-end gap-3 pt-2">
      <button type="submit" [disabled]="form.invalid || saving()"
              class="rounded-full bg-blue-600 px-8 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:opacity-50">
        {{ saving() ? 'Се испраќа…' : 'Испрати барање' }}
      </button>
    </div>
  </form>
</section>
