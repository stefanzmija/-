<app-auth-layout>
  <h1 class="text-3xl font-semibold text-slate-900">Добредојде назад</h1>
  <p class="mt-2 text-sm text-slate-500">Најави се за да ги видиш своите барања.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-5" novalidate>
    <div>
      <label for="email" class="field-label">Е-пошта</label>
      <input id="email" formControlName="email" type="email" autocomplete="email"
             placeholder="ime.prezime@students.finki.ukim.mk"
             class="field" [class.border-rose-400]="invalid('email')" />
      @if (invalid('email')) {
        <p class="mt-1.5 text-xs text-rose-600">Внеси валидна е-пошта.</p>
      }
    </div>

    <div>
      <label for="password" class="field-label">Лозинка</label>
      <div class="relative">
        <input id="password" formControlName="password" autocomplete="current-password"
               [type]="showPassword() ? 'text' : 'password'"
               class="field pr-11" [class.border-rose-400]="invalid('password')" />
        <button type="button" (click)="showPassword.set(!showPassword())"
                class="absolute inset-y-0 right-0 px-3.5 text-slate-400 hover:text-slate-600">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" class="size-4" />
        </button>
      </div>
      @if (invalid('password')) {
        <p class="mt-1.5 text-xs text-rose-600">Внеси ја лозинката.</p>
      }
    </div>

    @if (error()) {
      <div class="flex items-center gap-2 rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">
        <app-icon name="alert" class="size-4 shrink-0" />
        {{ error() }}
      </div>
    }

    <button type="submit" [disabled]="loading()" class="btn btn-primary w-full py-3">
      {{ loading() ? 'Се најавуваш…' : 'Најави се' }}
    </button>
  </form>

  <p class="mt-8 text-center text-sm text-slate-500">
    Немаш профил?
    <a routerLink="/register" class="font-semibold text-brand-600 hover:text-brand-700">Регистрирај се</a>
  </p>
</app-auth-layout>
